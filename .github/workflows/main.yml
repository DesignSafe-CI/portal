name: CI

# Controls when the action will run. Triggers the workflow on pushes to main or on pull request events
on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  Server_Side_Unit_Tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv and Python
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: 0.13.5
          python-version: "3.12"
          enable-cache: true

      - name: Ensure react-assets template exists for use in unit tests
        run: |
          touch designsafe/templates/react-assets.html

      - name: Install Python packages
        run: uv sync --locked --dev

      - name: Run Server-side unit tests and generate coverage report
        run: |
          uv run --no-sync python -m pytest \
            -c pytest.ini \
            --cov-config=.coveragerc \
            --cov=designsafe \
            --cov-report=xml \
            -ra designsafe

  Server_Side_Linting:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Fetch base branch
        env:
          BASE_BRANCH: ${{ github.base_ref || 'main' }}
        run: |
          git fetch origin \
            "$BASE_BRANCH:refs/remotes/origin/$BASE_BRANCH"

      - name: Setup uv and Python
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: 0.13.5
          python-version: "3.12"
          enable-cache: true

      - name: Install Python packages
        run: uv sync --locked --dev

      - name: Run Server-side linting with Ruff
        run: |
          uv run ruff check designsafe/apps

      - name: Run Server-side formatting with Ruff
        # Only run on new files for now-- for all changes, filter is ACMRTUXB
        # Check manage.py to prevent a crash if no files are selected.
        run: |
          uv run ruff format --check designsafe

  React_unit_tests:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache-dependency-path: "client/pnpm-lock.yaml"
          working-directory: "client"
          cache: true
          require-lockfile: true

      # The root Vitest config includes application and module tests.
      - name: Run client tests with coverage
        run: pnpm test --coverage

      # The build script runs TypeScript checks before building with Vite.
      - name: Build client
        run: pnpm build

  React_linting:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache-dependency-path: "client/pnpm-lock.yaml"
          working-directory: "client"
          cache: true
          require-lockfile: true

      - name: Check formatting
        run: pnpm format:check

      - name: Lint client
        run: pnpm lint
